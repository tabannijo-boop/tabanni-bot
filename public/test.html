<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tabanni bot — team test</title>
<style>
  :root{ --sand:#FBF3E7; --orange:#FF8C00; --orange-deep:#D9720A; --ink:#2B2320; --paper:#FFFDF9; --line:#EAD9C2; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);font-family:'Segoe UI',Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:24px 12px;}
  .phone{width:100%;max-width:420px;background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(43,35,32,0.18);border:1px solid var(--line);display:flex;flex-direction:column;height:85vh;min-height:500px;}
  .header{background:var(--orange);color:white;padding:16px;display:flex;align-items:center;gap:10px;}
  .pawmark{width:36px;height:36px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .header h1{font-size:15px;margin:0;}
  .header p{margin:2px 0 0;font-size:11px;opacity:0.9;}
  .messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:9px;background:var(--sand);}
  .msg{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;}
  .msg.bot{align-self:flex-start;background:white;border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink);}
  .msg.user{align-self:flex-end;background:var(--orange);color:white;border-bottom-right-radius:4px;}
  .msg[dir="rtl"]{text-align:right;}
  .handoff-note{align-self:center;font-size:10.5px;color:#B08A5A;background:#FFF3E0;border:1px solid var(--line);border-radius:10px;padding:4px 10px;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;background:white;border:1px solid var(--line);border-radius:15px;border-bottom-left-radius:4px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--orange-deep);opacity:0.5;animation:bounce 1.2s infinite;}
  .dot:nth-child(2){animation-delay:0.15s;} .dot:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-4px);opacity:1;}}
  .input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--paper);}
  .input-row input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 15px;font-size:14px;outline:none;background:var(--sand);}
  .send-btn{background:var(--orange);color:white;border:none;border-radius:50%;width:38px;height:38px;font-size:15px;cursor:pointer;flex-shrink:0;}
  .send-btn:disabled{opacity:0.5;}
  .footnote{text-align:center;font-size:9.5px;color:#B08A5A;padding:5px 0;background:var(--paper);}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="pawmark">🐾</div>
    <div><h1>tabanni</h1><p>Internal team test — not connected to real Instagram</p></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <input type="text" id="userInput" placeholder="Type a message… / اكتب رسالة" />
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
  <div class="footnote">Test page — replies come from the same brain as the real bot, but nothing here reaches Instagram</div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
let history = [];

function isRTL(text){ return /[\u0600-\u06FF]/.test(text); }

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if(isRTL(text)) div.setAttribute('dir','rtl');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addHandoffNote(){
  const div = document.createElement('div');
  div.className = 'handoff-note';
  div.textContent = '⚠️ Would be flagged for a volunteer in production';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){ const el = document.getElementById('typingIndicator'); if(el) el.remove(); }

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMessage('user', text);
  history.push({role:'user', content: text});
  inputEl.value = '';
  sendBtn.disabled = true;
  showTyping();

  try{
    const res = await fetch('/api/test-chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ history })
    });
    const data = await res.json();
    hideTyping();
    addMessage('bot', data.reply);
    if (data.handoff) addHandoffNote();
    history.push({role:'assistant', content: data.reply});
  }catch(err){
    hideTyping();
    addMessage('bot', "Connection error — check the server is running.");
    console.error(err);
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if(e.key==='Enter') sendMessage(); });
addMessage('bot', "Ahlan! 🐾 This is tabanni's assistant (test mode). Try asking about adoption, fostering, donating, or a lost/found pet.");
</script>
</body>
</html>
